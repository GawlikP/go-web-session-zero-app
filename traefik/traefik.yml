global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  traefik:           
    address: ":8080" 

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

log:
  level: "INFO"
  format: "common"

accessLog:
  format: "common"

ping:
  entryPoint: web
