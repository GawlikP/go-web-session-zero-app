root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build command - paths relative to /app (project root in container)
  cmd = "templ generate && go build -o /app/tmp/ssr /app/cmd/ssr/main.go"
  
  bin = "/app/tmp/ssr"
  
  include_ext = ["go", "templ"]
  include_dir = []
  
  exclude_dir = [
    "tmp",
    "vendor",
    "web/static",
    "logs",
    ".git",
    "testdata"
  ]
  
  exclude_file = []
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  
  delay = 1000
  stop_on_error = false
  kill_delay = "500ms"
  log = "build-errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
  app = ""

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
