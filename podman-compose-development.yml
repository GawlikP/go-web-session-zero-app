version: '3.8'

networks:
  ttrpg-network-dev:
    driver: bridge

volumes:
  go-mod-cache:
    driver: local
  rabbitmq-data:
    driver: local
  rabbitmq-logs:
    driver: local

services:
  traefik-dev:
    image: docker.io/library/traefik:v3.0
    container_name: traefik-dev
    restart: unless-stopped
    command:
      # API
      - "--api.dashboard=true"
      - "--api.insecure=true"  # Dev: no auth needed
      # Entry points (HTTP only, no HTTPS)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8080"
      # Providers
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Logging
      - "--log.level=DEBUG"
      - "--accesslog=true"
      # Ping
      - "--ping=true"
      - "--ping.entrypoint=web"
    ports:
      - "8000:80"
      - "8080:8080"
    networks:
      - ttrpg-network-dev
    volumes:
      - ./traefik/development/dynamic:/etc/traefik/dynamic:ro
    environment:
      - TZ=Europe/Warsaw
    labels:
      - "com.ttrpg.component=reverse-proxy-dev"

  ssr-service:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./cmd/ssr/Containerfile
      target: development  # Uses Air for hot-reload
    container_name: ssr-service-dev
    networks:
      - ttrpg-network-dev
    volumes:
      - ./:/app                    # Mount source for hot-reload
      - /app/tmp                   # Air temp directory
      - go-mod-cache:/go/pkg/mod   # Cache Go modules
      - ./logs:/app/logs           # Mount logs
    environment:
      - ENV=development
      - LOG_LEVEL=debug
      - SERVER_ADDRESS=0.0.0.0:4000
      - SSR_PORT=4000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s  # Air needs time to start
    depends_on:
      traefik-dev:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    labels:
      - "com.ttrpg.component=web-server-dev"

  rabbitmq:
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    image: docker.io/library/rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI/HTTP API port
    networks:
      - ttrpg-network-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:Z
      - rabbitmq-logs:/var/log/rabbitmq:Z
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin123}
      - RABBITMQ_ERLANG_COOKIE=development-secret-cookie
      - RABBITMQ_DEFAULT_VHOST=/
      - TZ=Europe/Warsaw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
