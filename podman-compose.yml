version: '3.8'

networks:
  ttrpg-network:
    driver: bridge

volumes:
  traefik-logs:
    driver: local

services:
  traefik:
      image: docker.io/library/traefik:v3.0
      container_name: traefik
      restart: unless-stopped
      command:
        # API
        - "--api.dashboard=true"
        - "--api.insecure=false"
        # Entry points
        - "--entrypoints.web.address=:80"
        - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
        - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
        - "--entrypoints.websecure.address=:443"
        - "--entrypoints.traefik.address=:8080"
        # Let's Encrypt
        - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
        - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
        - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
        - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
        # Providers
        - "--providers.file.directory=/etc/traefik/dynamic"
        - "--providers.file.watch=true"
        # Logging
        - "--log.level=INFO"
        - "--accesslog=true"
        # Ping
        - "--ping.entrypoint=web"
      ports:
        - "80:80"
        - "443:443"
        - "8080:8080"
      networks:
        - ttrpg-network
      volumes:
        - ./traefik/dynamic:/etc/traefik/dynamic:ro
        - ./traefik/auth:/etc/traefik/auth:ro
        - ./traefik/letsencrypt:/letsencrypt
        - traefik-logs:/var/log/traefik
      environment:
        - TZ=Europe/Warsaw
      env_file:
        - .env
      healthcheck:
        test: ["CMD", "traefik", "healthcheck", "--ping"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
      labels:
        - "com.ttrpg.component=reverse-proxy"
  ssr-service:
    build:
      context: .
      dockerfile: ./cmd/ssr/Containerfile
      target: production 
    image: ssr-service:latest
    container_name: ssr-service
    restart: unless-stopped
    networks:
      - ttrpg-network
    # NO volumes - code is baked into image
    environment:
      - ENV=production 
      - LOG_LEVEL=info
      - SERVER_ADDRESS=0.0.0.0:4000
      - TZ=Europe/Warsaw
      - SSR_PORT=4000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "com.ttrpg.component=web-server"
