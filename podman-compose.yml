version: '3.8'

networks:
  ttrpg-network:
    driver: bridge

volumes:
  go-mod-cache:
    driver: local
  traefik-logs:
    driver: local

services:
  traefik:
    image: docker.io/library/traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80" # updated for development, to be changed on production
      - "8080:8080"
    networks:
      - ttrpg-network
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
    environment:
      - TZ=Europe/Warsaw
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.ttrpg.component=reverse-proxy"

  ssr-service:
    env_file:
      - .env
    build:
      context: .                          # Project root as context
      dockerfile: ./cmd/ssr/Containerfile # Containerfile location
      target: development
    container_name: ssr-service
    restart: unless-stopped
    networks:
      - ttrpg-network
    volumes:
      - ./:/app
      - /app/tmp
      - go-mod-cache:/go/pkg/mod
      - ./logs:/app/logs
    environment:
      - ENV=development
      - LOG_LEVEL=debug
      - SERVER_ADDRESS=0.0.0.0:4000
      - TZ=Europe/Warsaw
      - SSR_PORT=4000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      - traefik
    labels:
      - "com.ttrpg.component=web-server"
